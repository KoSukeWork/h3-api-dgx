[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-api"
version = "0.1.0"
description = "Serial BF16 MiniMax H3 API service for DGX Spark"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "filelock>=3.18,<4",
  "huggingface-hub>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
h3-prepare = "h3_api.prepare:main"
h3-preflight = "h3_api.preflight:main"

[tool.setuptools.packages.find]
include = ["h3_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
